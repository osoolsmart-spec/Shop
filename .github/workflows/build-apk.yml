name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          if [ -f index.html ]; then cp index.html www/index.html; else cp shop-guard.html www/index.html; fi

      - name: Bundle object detection model (works offline)
        run: |
          mkdir -p www/lib www/model
          curl -fsSL --retry 3 -o www/lib/tf.min.js https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js || rm -f www/lib/tf.min.js
          curl -fsSL --retry 3 -o www/lib/coco-ssd.min.js https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js || rm -f www/lib/coco-ssd.min.js
          python3 - <<'PY'
          import json, os, subprocess
          base = 'https://storage.googleapis.com/tfjs-models/savedmodel/ssdlite_mobilenet_v2'
          def get(name):
              r = subprocess.run(['curl', '-fsSL', '--retry', '3', '-o', 'www/model/' + name, base + '/' + name])
              return r.returncode == 0
          if get('model.json'):
              m = json.load(open('www/model/model.json'))
              ok = True
              for grp in m.get('weightsManifest', []):
                  for p in grp['paths']:
                      ok = get(p) and ok
              if not ok:
                  print('some model files failed; the app will download the model online instead')
                  for f in os.listdir('www/model'):
                      os.remove('www/model/' + f)
          else:
              print('model.json not available; the app will download the model online')
          PY
          ls -la www/lib www/model

      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init ShopGuard com.shopguard.app --web-dir www
          npx cap add android

      - name: Add native code
        run: |
          PKG=android/app/src/main/java/com/shopguard/app
          mkdir -p $PKG

          cat > $PKG/MainActivity.java <<'EOF'
          package com.shopguard.app;

          import android.Manifest;
          import android.os.Build;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle b) {
              registerPlugin(ShopPlugin.class);
              super.onCreate(b);
              if (Build.VERSION.SDK_INT >= 27) { setShowWhenLocked(true); setTurnScreenOn(true); }
              if (Build.VERSION.SDK_INT >= 33) {
                requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 77);
              }
            }

            @Override
            public void onPause() {
              super.onPause();
              try {
                getBridge().getWebView().onResume();
                getBridge().getWebView().resumeTimers();
              } catch (Exception e) {}
            }
          }
          EOF

          cat > $PKG/ShopPlugin.java <<'EOF'
          package com.shopguard.app;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import android.view.WindowManager;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "ShopNative")
          public class ShopPlugin extends Plugin {

            @PluginMethod
            public void start(PluginCall call) {
              final boolean keep = call.getBoolean("keep", true);
              getContext().getSharedPreferences("sg", 0).edit().putBoolean("noOff", call.getBoolean("noOff", true)).apply();
              getActivity().runOnUiThread(() -> {
                if (keep) {
                  getActivity().getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                } else {
                  getActivity().getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                }
                Intent i = new Intent(getContext(), GuardService.class);
                try {
                  if (Build.VERSION.SDK_INT >= 26) getContext().startForegroundService(i);
                  else getContext().startService(i);
                } catch (Exception e) {}
              });
              call.resolve();
            }

            private void openSettings(String action, boolean withPackage) {
              try {
                Intent i = new Intent(action);
                if (withPackage) i.setData(Uri.parse("package:" + getContext().getPackageName()));
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                getContext().startActivity(i);
              } catch (Exception e) {}
            }

            @PluginMethod
            public void openOverlay(PluginCall call) {
              openSettings(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, true);
              call.resolve();
            }

            @PluginMethod
            public void ignoreBattery(PluginCall call) {
              openSettings(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, true);
              call.resolve();
            }

            @PluginMethod
            public void openHome(PluginCall call) {
              openSettings(Settings.ACTION_HOME_SETTINGS, false);
              call.resolve();
            }

            @PluginMethod
            public void setGuard(PluginCall call) {
              final boolean noOff = call.getBoolean("noOff", true);
              final boolean black = call.getBoolean("black", false);
              getContext().getSharedPreferences("sg", 0).edit().putBoolean("noOff", noOff).apply();
              getActivity().runOnUiThread(() -> {
                try {
                  WindowManager.LayoutParams lp = getActivity().getWindow().getAttributes();
                  lp.screenBrightness = black ? 0.01f : WindowManager.LayoutParams.BRIGHTNESS_OVERRIDE_NONE;
                  getActivity().getWindow().setAttributes(lp);
                } catch (Exception e) {}
              });
              call.resolve();
            }

            @PluginMethod
            public void stop(PluginCall call) {
              getActivity().runOnUiThread(() -> {
                getActivity().getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                try {
                  getContext().stopService(new Intent(getContext(), GuardService.class));
                } catch (Exception e) {}
              });
              call.resolve();
            }
          }
          EOF

          cat > $PKG/GuardService.java <<'EOF'
          package com.shopguard.app;

          import android.Manifest;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.PackageManager;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;

          public class GuardService extends Service {
            private PowerManager.WakeLock wl;
            private BroadcastReceiver off;

            private void wakeScreen() {
              try {
                PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                PowerManager.WakeLock w = pm.newWakeLock(
                  PowerManager.SCREEN_BRIGHT_WAKE_LOCK | PowerManager.ACQUIRE_CAUSES_WAKEUP | PowerManager.ON_AFTER_RELEASE,
                  "shopguard:wake");
                w.acquire(4000);
              } catch (Exception e) {}
              try {
                Intent a = new Intent(this, MainActivity.class);
                a.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                startActivity(a);
              } catch (Exception e) {}
            }

            @Override
            public IBinder onBind(Intent i) { return null; }

            private boolean has(String p) {
              return checkSelfPermission(p) == PackageManager.PERMISSION_GRANTED;
            }

            @Override
            public int onStartCommand(Intent intent, int flags, int startId) {
              String ch = "guard";
              NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
              Notification.Builder b;
              if (Build.VERSION.SDK_INT >= 26) {
                nm.createNotificationChannel(new NotificationChannel(ch, "Guard", NotificationManager.IMPORTANCE_LOW));
                b = new Notification.Builder(this, ch);
              } else {
                b = new Notification.Builder(this);
              }
              Notification n = b.setContentTitle("حارس المحل")
                .setContentText("المراقبة تعمل")
                .setSmallIcon(android.R.drawable.ic_lock_idle_lock)
                .setOngoing(true)
                .build();
              try {
                if (Build.VERSION.SDK_INT >= 30) {
                  int t = 0;
                  if (has(Manifest.permission.CAMERA)) t |= ServiceInfo.FOREGROUND_SERVICE_TYPE_CAMERA;
                  if (has(Manifest.permission.RECORD_AUDIO)) t |= ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE;
                  if (has(Manifest.permission.ACCESS_FINE_LOCATION)) t |= ServiceInfo.FOREGROUND_SERVICE_TYPE_LOCATION;
                  if (t == 0) t = ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC;
                  startForeground(1, n, t);
                } else {
                  startForeground(1, n);
                }
              } catch (Exception e) {
                try { startForeground(1, n); } catch (Exception e2) {}
              }
              if (wl == null) {
                PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "shopguard:wl");
                wl.acquire();
              }
              if (off == null) {
                off = new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context c, Intent i) {
                    if (getSharedPreferences("sg", 0).getBoolean("noOff", true)) wakeScreen();
                  }
                };
                IntentFilter f = new IntentFilter(Intent.ACTION_SCREEN_OFF);
                try {
                  if (Build.VERSION.SDK_INT >= 33) registerReceiver(off, f, Context.RECEIVER_NOT_EXPORTED);
                  else registerReceiver(off, f);
                } catch (Exception e) {}
              }
              return START_STICKY;
            }

            /* إذا سُحب التطبيق من قائمة التطبيقات الأخيرة أثناء المراقبة، نحاول إعادة فتحه */
            @Override
            public void onTaskRemoved(Intent rootIntent) {
              try {
                Intent a = new Intent(this, MainActivity.class);
                a.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                startActivity(a);
              } catch (Exception e) {}
              super.onTaskRemoved(rootIntent);
            }

            @Override
            public void onDestroy() {
              if (wl != null && wl.isHeld()) wl.release();
              try { if (off != null) unregisterReceiver(off); } catch (Exception e) {}
              off = null;
              wl = null;
              super.onDestroy();
            }
          }
          EOF

          cat > $PKG/BootReceiver.java <<'EOF'
          package com.shopguard.app;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class BootReceiver extends BroadcastReceiver {
            @Override
            public void onReceive(Context c, Intent i) {
              try {
                Intent a = new Intent(c, MainActivity.class);
                a.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                c.startActivity(a);
              } catch (Exception e) {}
            }
          }
          EOF

      - name: Patch manifest and name
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = ['ACCESS_NETWORK_STATE', 'CAMERA','RECORD_AUDIO', 'MODIFY_AUDIO_SETTINGS', 'ACCESS_FINE_LOCATION',
                   'ACCESS_COARSE_LOCATION', 'WAKE_LOCK', 'FOREGROUND_SERVICE',
                   'FOREGROUND_SERVICE_CAMERA', 'FOREGROUND_SERVICE_MICROPHONE',
                   'FOREGROUND_SERVICE_LOCATION', 'FOREGROUND_SERVICE_DATA_SYNC', 'POST_NOTIFICATIONS',
                   'RECEIVE_BOOT_COMPLETED', 'SYSTEM_ALERT_WINDOW', 'REQUEST_IGNORE_BATTERY_OPTIMIZATIONS']
          add = ''.join('    <uses-permission android:name="android.permission.%s" />\n' % x for x in perms)
          svc = ('        <service android:name=".GuardService" android:exported="false" android:foregroundServiceType="camera|microphone|location|dataSync" />\n'
                 '        <receiver android:name=".BootReceiver" android:exported="true">\n'
                 '            <intent-filter>\n'
                 '                <action android:name="android.intent.action.BOOT_COMPLETED" />\n'
                 '                <action android:name="android.intent.action.QUICKBOOT_POWERON" />\n'
                 '            </intent-filter>\n'
                 '        </receiver>\n')
          home = ('        <intent-filter>\n'
                  '            <action android:name="android.intent.action.MAIN" />\n'
                  '            <category android:name="android.intent.category.HOME" />\n'
                  '            <category android:name="android.intent.category.DEFAULT" />\n'
                  '        </intent-filter>\n'
                  '        </activity>')
          s = s.replace('</activity>', home, 1)
          s = s.replace('<activity', '<activity android:screenOrientation="sensorLandscape"', 1)
          s = s.replace('<application', add + '    <application', 1)
          s = s.replace('</application>', svc + '    </application>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">حارس المحل</string>|' android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">حارس المحل</string>|' android/app/src/main/res/values/strings.xml

      - name: Keep the same signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Sync and build
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          # Gradle's own download (via GitHub releases) returned 504, so fetch it ourselves from several sources
          VER=$(sed -n 's/.*gradle-\([0-9.]*\)-.*zip.*/\1/p' gradle/wrapper/gradle-wrapper.properties | head -1)
          echo "Gradle version: $VER"
          ZIP=/tmp/gradle-$VER-bin.zip
          got=0
          for url in \
            "https://services.gradle.org/distributions/gradle-$VER-bin.zip" \
            "https://mirrors.cloud.tencent.com/gradle/gradle-$VER-bin.zip" \
            "https://mirrors.aliyun.com/gradle/gradle-$VER-bin.zip"; do
            echo "Trying $url"
            if curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 20 --max-time 300 -o "$ZIP" "$url" && unzip -tq "$ZIP" > /dev/null 2>&1; then
              got=1; break
            fi
            echo "Failed: $url"
          done
          test $got -eq 1
          sed -i '/distributionUrl/d;/validateDistributionUrl/d;/networkTimeout/d' gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=file\\:$ZIP" >> gradle/wrapper/gradle-wrapper.properties
          echo 'validateDistributionUrl=false' >> gradle/wrapper/gradle-wrapper.properties
          echo 'networkTimeout=180000' >> gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties
          ok=0
          for i in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon; then ok=1; break; fi
            echo "Gradle attempt $i failed, retrying in 20s"
            sleep 20
          done
          test $ok -eq 1

      - uses: actions/upload-artifact@v4
        with:
          name: shopguard-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ShopGuard build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
